<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #d6e2f0ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      html {
        font-family: 'Outfit', sans-serif;
      }

      .card {
        width: 320px;
        background-color: #fff;
        border-radius: 12px;
        gap: 20px;
        padding: 20px;
        font-weight: 400;
      }

      @media (max-width: 600px) {
        .card {
          background-color: #f0f0f0;
        }

        .card__heading {
          font-size: 18px;
        }
      }

      .card__img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .card__heading {
        font-size: 22px;
        color: #1f3251ff;
        text-align: center;
        margin-bottom: 10px;
      }

      .card__description {
        font-size: 16px;
        color: #68778dff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        class="card__img"
        src="./images/image-qr-code.png"
        alt="qr-code" />
      <h2 class="card__heading">Improve your front-end skills by building projects</h2>
      <p class="card__description"
        >Scan the QR Code to visit Frontend Mentor and take your coding skills to the next level</p
      >
    </div>
  </body>
</html>
